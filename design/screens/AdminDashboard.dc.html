<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Back-office — tableau de bord</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components-reference/bundle.css">
<script src="../components-reference/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1A1A1A}a:hover{color:#C24400}
</style>
</helmet>
<div style="min-height: 1100px; display: flex; flex-wrap: wrap; background: var(--surface); color: var(--ink); font-family: var(--font-body)">
<aside style="flex: 1 1 240px; max-width: 100%; background: var(--surface-raised); border-right: 1px solid var(--line); padding: 20px 16px; display: flex; flex-direction: column; gap: 24px">
<a href="AdminDashboard.dc.html" aria-label="NEXO SHIFT, tableau de bord" style="display: flex; align-items: center; gap: 10px; text-decoration: none; padding: 0 8px">
<img src="/_blob/831dc0b6bed920db21f3005f2fb97bd9" alt="" style="width: 36px; height: 36px">
<img src="/_blob/90f38a8a5b493e756b98d65dfc426c91" alt="NEXO SHIFT" style="height: 16px; width: auto">
</a>
<nav aria-label="Back-office" style="display: flex; flex-direction: column; gap: 4px; font-size: 15px; font-weight: 700">
<a href="AdminDashboard.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 14px; text-decoration: none; background: var(--ink); color: var(--ink-inverse)"><x-import component-from-global-scope="NexoShift.Icon" name="package" size="{{s20}}"></x-import>Commandes</a>
<a href="AdminCommande.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 14px; text-decoration: none"><x-import component-from-global-scope="NexoShift.Icon" name="whatsapp" size="{{s20}}"></x-import>Messages IA</a>
<a href="AdminFinances.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 14px; text-decoration: none"><x-import component-from-global-scope="NexoShift.Icon" name="banknote" size="{{s20}}"></x-import>Finances</a>
<a href="AdminStock.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 14px; text-decoration: none"><x-import component-from-global-scope="NexoShift.Icon" name="coffee" size="{{s20}}"></x-import>Stock &amp; marges</a>
</nav>
<div style="margin-top: auto; padding: 14px; border-radius: 14px; background: var(--warning-soft); color: var(--warning); display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 18px; font-weight: 700">
<x-import component-from-global-scope="NexoShift.Icon" name="alert" size="{{s18}}"></x-import>
<span>Stock bas : plus que 4 packs complets. <a href="AdminStock.dc.html" style="color: var(--warning)">Voir le stock</a></span>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<span style="width: 32px; height: 32px; border-radius: 999px; background: var(--ink); color: var(--ink-inverse); display: grid; place-items: center; font-size: 12px; font-weight: 800">AD</span>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Admin</span><span style="font-size: 12px; color: var(--ink-muted)">Agent commercial</span></div>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<div style="display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 36px">Tableau de bord</h1>
<span style="font-size: 14px; color: var(--ink-muted); font-weight: 600">Novembre 2026 · pipeline COD</span>
</div>
<div style="margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; align-items: center">
<label for="search-orders" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher une commande</label>
<input id="search-orders" type="search" placeholder="#2948, nom, téléphone…" style="width: 260px; max-width: 100%; height: 44px; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--line-strong); background: var(--surface-raised); font: inherit; font-size: 15px; color: var(--ink)">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 14px; background: var(--surface-raised); box-shadow: inset 0 0 0 1.5px var(--line-strong); font-size: 14px; font-weight: 700"><x-import component-from-global-scope="NexoShift.Icon" name="calendar" size="{{s16}}"></x-import>Nov. 2026</span>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<x-import component-from-global-scope="NexoShift.KpiCard" label="Commandes" value="142" icon="package" delta="+18 %" trend="up" accent="{{yes}}"></x-import>
<x-import component-from-global-scope="NexoShift.KpiCard" label="Chiffre d'affaires" value="12 638 TND" icon="banknote" delta="+11 %" trend="up"></x-import>
<x-import component-from-global-scope="NexoShift.KpiCard" label="Taux de retour" value="8 %" icon="undo" delta="−2 pts" trend="down" good="{{yes}}"></x-import>
<x-import component-from-global-scope="NexoShift.KpiCard" label="À confirmer" value="22" icon="whatsapp"></x-import>
</div>

<x-import component-from-global-scope="NexoShift.KanbanBoard" counts="{{counts}}"></x-import>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, s16: 16, s18: 18, s20: 20, counts: { new: 14, pending: 8, confirmed: 24, shipped: 5 } };
  }
}
</script>
</body>
</html>
