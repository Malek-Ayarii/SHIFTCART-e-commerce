<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Checkout avec erreurs</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components-reference/bundle.css">
<script src="../components-reference/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-body)">
<x-import component-from-global-scope="ShiftCart.Navbar" logo-src="/_blob/90f38a8a5b493e756b98d65dfc426c91" logo-height="{{logoH}}" count="{{one}}"></x-import>
<section style="padding: 24px 16px">
<h1 style="margin: 0 0 20px; font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 40px; letter-spacing: -0.02em; text-transform: uppercase">Booste ta routine, <span style="color: var(--orange-ink)">sauve ton budget</span></h1>
<div style="height: 420px; border-radius: 20px; background: var(--ink)"></div>
</section>
<x-import component-from-global-scope="ShiftCart.BottomSheet" open="{{yes}}" title="Finalise ta commande" subtitle="Tu paies à la livraison" on-close="{{noop}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 14px; background: var(--danger-soft); color: var(--danger); font-size: 14px; line-height: 20px; font-weight: 700">
<x-import component-from-global-scope="ShiftCart.Icon" name="alert" size="{{s18}}"></x-import>
2 infos à corriger avant de valider
</div>
<x-import component-from-global-scope="ShiftCart.TextField" id="err-name" label="Nom &amp; prénom" default-value="Mohamed Ben Ali" auto-complete="name"></x-import>
<x-import component-from-global-scope="ShiftCart.PhoneInput" id="err-phone" value="98765" error="Il manque 3 chiffres (8 au total)." on-change="{{noop}}"></x-import>
<x-import component-from-global-scope="ShiftCart.GovernorateSelect" id="err-gov" value="" error="Choisis où te livrer." on-change="{{noop}}"></x-import>
<x-import component-from-global-scope="ShiftCart.Button" variant="primary" size="xl" block="{{yes}}">Confirmer ma commande 🚀</x-import>
<p style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--ink-muted)">
<x-import component-from-global-scope="ShiftCart.Icon" name="banknote" size="{{s18}}"></x-import>
* Pas de carte, paiement en espèces.
</p>
</div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, one: 1, logoH: 20, s18: 18, noop: () => {} };
  }
}
</script>
</body>
</html>
