<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Checkout express</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components-reference/bundle.css">
<script src="../components-reference/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-body)">
<x-import component-from-global-scope="ShiftCart.Navbar" logo-src="/_blob/90f38a8a5b493e756b98d65dfc426c91" logo-height="{{logoH}}" count="{{one}}"></x-import>
<section style="padding: 24px 16px">
<h1 style="margin: 0 0 20px; font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 40px; letter-spacing: -0.02em; text-transform: uppercase">Booste ta routine, <span style="color: var(--orange-ink)">sauve ton budget</span></h1>
<div style="height: 420px; border-radius: 20px; background: var(--ink)"></div>
</section>
<x-import component-from-global-scope="ShiftCart.BottomSheet" open="{{yes}}" title="Finalise ta commande" subtitle="Tu paies à la livraison" on-close="{{noop}}">
<x-import component-from-global-scope="ShiftCart.CheckoutForm" price="{{price}}" product-name="Le Pack Barista"></x-import>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, one: 1, price: 89, logoH: 20, noop: () => {} };
  }
}
</script>
</body>
</html>
