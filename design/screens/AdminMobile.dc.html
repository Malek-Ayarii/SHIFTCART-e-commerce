<sc-if value="{{t.off}}" hint-placeholder-val="{{t.off}}">
<button type="button" aria-pressed="false" onClick="{{t.pick}}" style="flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 0; font: inherit; font-size: 13px; font-weight: 800; white-space: nowrap; cursor: pointer; background: var(--surface-raised); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong)">{{t.label}} · {{t.count}}</button>
</sc-if>
</sc-for>
</div>

<div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
